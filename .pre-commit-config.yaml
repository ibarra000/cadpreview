exclude: ^(external/|corpus/(synthetic|files)/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.5
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.2
    hooks:
      - id: isort

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        additional_dependencies: [pytest==9.2.0]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-ll, -q]
        files: ^tools/[^/]+\.py$

  - repo: local
    hooks:
      - id: corpus-manifest
        name: corpus manifest
        entry: python tools/corpus.py validate
        language: python
        pass_filenames: false
        always_run: true

      - id: dotnet-format
        name: dotnet format
        entry: dotnet format bindings/dotnet/CadPreview.slnx --verify-no-changes
        language: system
        pass_filenames: false
        files: ^(bindings/dotnet/|\.editorconfig$)

      - id: clang-tidy
        name: clang-tidy (needs a configured build)
        entry: python tools/clang_tidy.py
        language: python
        additional_dependencies: [clang-tidy==23.1.4]
        types_or: [c++]
        stages: [pre-push]
