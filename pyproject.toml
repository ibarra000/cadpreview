# Tool settings for the Python helpers in tools/ and tests/. This is not a Python package.

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S", "SIM", "PL", "RUF"]
ignore = [
    "S603",    # subprocess calls take argument lists, never a shell
    "S607",    # tools are found on PATH by design (dotnet, clang-tidy)
    "PLR2004", # small literal constants in tests read better inline
    "PLR0913", # corpus runner functions mirror their command-line options
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tools/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "tools"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
